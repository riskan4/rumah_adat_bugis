<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Drone - Rumah Adat Bugis</title>
    <link rel="stylesheet" href="style/view-drone.css">
</head>

<body>

    <a href="index.html" class="back-btn">← Kembali</a>

    <section class="main-section">
        <h1>Pratinjau Utama</h1>

        <div class="video-wrapper">
            <video id="mainVideo" controls>
                <source src="assets\videos\drone_main_kualitas_rendah.mp4" type="video/mp4">
                Browser Anda tidak mendukung pemutar video.
            </video>
        </div>

        <h2>Video Lainnya</h2>

        <div class="thumb-container">

            <!-- GANTI NAMA FILE SESUAI VIDEO ANDA -->
            <video class="thumb" onclick="changeVideo('assets\videos\drone2n.mp4')" muted>
                <source src="assets\videos\drone2n.mp4" type="video/mp4">
            </video>

            <video class="thumb" onclick="changeVideo('assets\videos\drone3n.mp4')" muted>
                <source src="assets\videos\drone3n.mp4" type="video/mp4">
            </video>

            <video class="thumb" onclick="changeVideo('assets\videos\drone4n.mp4')" muted>
                <source src="assets\videos\drone4n.mp4" type="video/mp4">
            </video>

            <video class="thumb" onclick="changeVideo('assets\videos\drone5n.mp4')" muted>
                <source src="assets\videos\drone5n.mp4" type="video/mp4">
            </video>

            <video class="thumb" onclick="changeVideo('assets\videos\drone6n.mp4')" muted>
                <source src="assets\videos\drone6n.mp4" type="video/mp4">
            </video>
        </div>

        <h2>Keterangan</h2>

        <p class="desc">
            Video drone ini digunakan untuk mendukung pembelajaran etnomatematika: 
            mengamati proporsi, simetri, dan struktur geometris pada rumah adat Bugis.
        </p>

    </section>

<script>
function changeVideo(src) {
    const video = document.getElementById("mainVideo");
    video.src = src;
    video.play();
}
</script>

</body>
</html>
